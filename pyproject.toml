[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-generation"
version = "0.5.0"
description = "Generation-first C/C++ fuzz harness planning, preflight, compilation and runtime observation"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<3",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
harness-generation = "harness_generation.cli:main"

[tool.setuptools]
py-modules = ["project_catalog"]

[tool.setuptools.packages.find]
include = ["harness_generation*", "sfg_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Both pytest entry points import the current working tree.
pythonpath = ["."]
